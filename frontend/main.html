<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Main Arena — MPL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #07071a; --card: rgba(255,255,255,.038); --border: rgba(255,255,255,.08);
      --purple: #7c3aed; --purple-light: #a78bfa; --purple-glow: rgba(124,58,237,.25);
      --green: #10b981; --yellow: #f59e0b; --red: #ef4444;
      --text: #e2e8f0; --muted: #64748b; --code-bg: rgba(0,0,0,.35);
    }
    body { font-family: 'Space Grotesk', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    .orb { position: fixed; border-radius: 50%; filter: blur(90px); opacity: .1; pointer-events: none; z-index: 0; }
    .orb-1 { width:550px;height:550px; background:radial-gradient(#7c3aed,transparent 70%); top:-180px;left:-120px; }
    .orb-2 { width:400px;height:400px; background:radial-gradient(#06b6d4,transparent 70%); bottom:-120px;right:-80px; }
    .grid-bg { position:fixed;inset:0;z-index:0;
      background-image:linear-gradient(rgba(255,255,255,.016) 1px,transparent 1px),
                       linear-gradient(90deg,rgba(255,255,255,.016) 1px,transparent 1px);
      background-size:52px 52px; }

    .page { position:relative; z-index:1; }

    @keyframes fadeUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }

    /* ─────────── Login ─────────── */
    #login-view { display:flex; align-items:center; justify-content:center; min-height:100vh; }
    .login-box {
      width:100%; max-width:420px; background:var(--card); border:1px solid var(--border);
      border-radius:24px; padding:44px 40px; backdrop-filter:blur(24px);
      box-shadow:0 32px 80px rgba(0,0,0,.4); animation: fadeUp .5s ease both;
    }
    .login-icon { font-size:2.5rem; text-align:center; margin-bottom:10px; }
    .login-box h2 { text-align:center; font-size:1.5rem; font-weight:700; margin-bottom:6px; }
    .login-sub { text-align:center; color:var(--muted); font-size:.875rem; margin-bottom:32px; }
    label { display:block; font-size:.8rem; font-weight:600; color:var(--muted); margin-bottom:7px; letter-spacing:.06em; text-transform:uppercase; }
    .inp-wrap { margin-bottom:18px; }
    input[type=text], input[type=password] {
      width:100%; padding:13px 16px; background:rgba(255,255,255,.05); border:1px solid var(--border);
      border-radius:12px; color:var(--text); font-family:inherit; font-size:.95rem;
      outline:none; transition:border-color .2s, box-shadow .2s;
    }
    input:focus { border-color:var(--purple); box-shadow:0 0 0 3px var(--purple-glow); }
    .btn-login {
      width:100%; padding:14px; background:linear-gradient(135deg,#7c3aed,#6d28d9);
      border:none; border-radius:12px; color:#fff; font-family:inherit;
      font-size:.95rem; font-weight:700; cursor:pointer;
      transition:opacity .2s, transform .1s, box-shadow .2s;
      box-shadow:0 8px 24px rgba(124,58,237,.4);
    }
    .btn-login:hover { opacity:.9; }
    .btn-login:disabled { opacity:.5; cursor:not-allowed; }
    .err-msg { margin-top:14px; padding:10px 14px; background:rgba(239,68,68,.1); border:1px solid rgba(239,68,68,.25); border-radius:10px; font-size:.825rem; color:#fca5a5; display:none; }
    .err-msg.show { display:block; }
    .back-link { margin-top:20px; text-align:center; }
    .back-link a { color:var(--muted); font-size:.825rem; text-decoration:none; }
    .back-link a:hover { color:var(--purple-light); }

    /* ─────────── Top bar ─────────── */
    .topbar { position:sticky; top:0; z-index:50; background:rgba(7,7,26,.9);
      border-bottom:1px solid var(--border); backdrop-filter:blur(20px); padding:0 20px; }
    .topbar-inner { max-width:1680px; margin:0 auto; display:flex; align-items:center;
      justify-content:space-between; height:62px; gap:18px; }
    .team-pill { display:flex; align-items:center; gap:10px; background:rgba(124,58,237,.1);
      border:1px solid rgba(124,58,237,.25); padding:5px 14px; border-radius:100px; }
    .team-pill .avatar { width:26px;height:26px;border-radius:50%;
      background:linear-gradient(135deg,#7c3aed,#06b6d4);
      display:flex;align-items:center;justify-content:center;font-size:.68rem;font-weight:700;color:#fff; }
    .team-pill .tname { font-size:.85rem; font-weight:600; color:var(--purple-light); }
    .timer-block { display:flex; flex-direction:column; align-items:center; }
    #timer { font-family:'JetBrains Mono',monospace; font-size:1.7rem; font-weight:500; letter-spacing:.05em; }
    .timer-green { color:#34d399; } .timer-yellow { color:#fbbf24; } .timer-red { color:#f87171; animation:pulse 1s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.55} }
    .timer-label { font-size:.62rem; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); }
    .stat-pill { background:rgba(255,255,255,.05); border:1px solid var(--border);
      padding:5px 12px; border-radius:100px; font-size:.78rem; color:var(--muted); }
    .stat-pill b { color:var(--text); }
    .btn-logout { background:transparent; border:1px solid var(--border); color:var(--muted);
      font-family:inherit; font-size:.78rem; padding:6px 13px; border-radius:8px; cursor:pointer; }
    .btn-logout:hover { border-color:rgba(239,68,68,.4); color:#fca5a5; }

    /* ─────────── Layout ─────────── */
    #arena-view { display:none; }
    .arena-grid { display:grid; grid-template-columns: 380px 1fr; gap:16px;
      max-width:1680px; margin:0 auto; padding:16px 20px 24px; align-items:start; }
    @media (max-width: 1100px) { .arena-grid { grid-template-columns: 1fr; } }

    .panel { background:var(--card); border:1px solid var(--border); border-radius:16px; overflow:hidden; }
    .panel-head { padding:12px 16px; border-bottom:1px solid var(--border);
      display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .panel-title { font-size:.72rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); }

    /* Question tabs */
    .q-tabs { display:flex; flex-direction:column; gap:8px; padding:12px; }
    .q-tab { text-align:left; background:rgba(255,255,255,.03); border:1px solid var(--border);
      border-radius:12px; padding:12px 14px; cursor:pointer; color:var(--text);
      font-family:inherit; transition:border-color .2s, background .2s; }
    .q-tab:hover { border-color:rgba(124,58,237,.4); }
    .q-tab.active { border-color:var(--purple); background:rgba(124,58,237,.12); }
    .q-tab-top { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:4px; }
    .q-tab-name { font-size:.9rem; font-weight:600; }
    .badge { font-size:.62rem; font-weight:700; letter-spacing:.05em; padding:2px 7px;
      border-radius:6px; text-transform:uppercase; }
    .badge-debug { background:rgba(16,185,129,.15); color:#6ee7b7; }
    .badge-math { background:rgba(245,158,11,.15); color:#fcd34d; }
    .badge-leetcode { background:rgba(124,58,237,.18); color:var(--purple-light); }
    .q-tab-meta { font-size:.75rem; color:var(--muted); display:flex; gap:10px; }
    .q-tab-meta .ok { color:var(--green); }

    /* Problem panel */
    .problem-body { padding:16px; max-height:calc(100vh - 340px); overflow-y:auto; }
    .problem-title { font-size:1.15rem; font-weight:700; margin-bottom:6px; }
    .problem-desc { white-space:pre-wrap; font-size:.875rem; line-height:1.65; color:#cbd5e1; }
    .section-label { font-size:.68rem; font-weight:700; letter-spacing:.1em;
      text-transform:uppercase; color:var(--muted); margin:18px 0 8px; }
    .sample { background:var(--code-bg); border:1px solid var(--border);
      border-radius:10px; padding:10px 12px; margin-bottom:8px; }
    .sample-row { display:grid; grid-template-columns:70px 1fr; gap:8px;
      font-family:'JetBrains Mono',monospace; font-size:.78rem; margin-bottom:4px; }
    .sample-row:last-child { margin-bottom:0; }
    .sample-row .k { color:var(--muted); }
    .sample-row .v { color:#e2e8f0; white-space:pre-wrap; word-break:break-word; }

    /* Editor column */
    .editor-col { display:flex; flex-direction:column; gap:14px; }
    .editor-bar { padding:10px 14px; border-bottom:1px solid var(--border);
      display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
    select { background:rgba(255,255,255,.05); border:1px solid var(--border); color:var(--text);
      font-family:inherit; font-size:.82rem; padding:7px 10px; border-radius:8px; outline:none; }
    .btn { font-family:inherit; font-size:.82rem; font-weight:600; padding:8px 16px;
      border-radius:9px; cursor:pointer; border:1px solid transparent; transition:opacity .2s; }
    .btn:disabled { opacity:.45; cursor:not-allowed; }
    .btn-run { background:rgba(255,255,255,.06); border-color:var(--border); color:var(--text); }
    .btn-run:hover:not(:disabled) { border-color:rgba(124,58,237,.5); }
    .btn-submit { background:linear-gradient(135deg,#7c3aed,#6d28d9); color:#fff;
      box-shadow:0 6px 18px rgba(124,58,237,.35); }
    .spacer { flex:1; }
    .hint { font-size:.72rem; color:var(--muted); }

    #monaco-host { height:420px; width:100%; }
    #code-fallback { height:420px; width:100%; background:rgba(0,0,0,.4); color:#e2e8f0;
      border:none; padding:14px; font-family:'JetBrains Mono',monospace; font-size:.85rem;
      line-height:1.6; resize:vertical; outline:none; }
    .editor-loading { padding:14px; font-size:.8rem; color:var(--muted); }

    /* Results */
    .verdict { padding:12px 16px; border-bottom:1px solid var(--border);
      display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
    .verdict-dot { width:9px; height:9px; border-radius:50%; background:var(--muted); }
    .verdict-text { font-weight:700; font-size:.95rem; }
    .v-passed { color:var(--green); } .v-partial { color:var(--yellow); }
    .v-failed { color:var(--red); } .v-error { color:var(--yellow); }
    .verdict-stats { font-size:.8rem; color:var(--muted); }

    .results-list { padding:12px 16px; display:flex; flex-direction:column; gap:8px; max-height:300px; overflow-y:auto; }
    .res-row { border:1px solid var(--border); border-radius:10px; padding:10px 12px; background:rgba(255,255,255,.02); }
    .res-row.pass { border-color:rgba(16,185,129,.35); background:rgba(16,185,129,.06); }
    .res-row.fail { border-color:rgba(239,68,68,.3); background:rgba(239,68,68,.05); }
    .res-head { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:6px; }
    .res-name { font-size:.8rem; font-weight:600; }
    .res-status { font-size:.7rem; font-family:'JetBrains Mono',monospace; color:var(--muted); }
    .res-io { font-family:'JetBrains Mono',monospace; font-size:.75rem; color:#cbd5e1;
      white-space:pre-wrap; word-break:break-word; line-height:1.5; }
    .res-io .k { color:var(--muted); }
    .res-hidden-note { font-size:.75rem; color:var(--muted); font-style:italic; }
    pre.out { background:rgba(0,0,0,.4); border:1px solid var(--border); border-radius:8px;
      padding:10px 12px; font-family:'JetBrains Mono',monospace; font-size:.75rem;
      white-space:pre-wrap; word-break:break-word; max-height:180px; overflow:auto; margin-top:8px; }
    .empty { padding:22px 16px; text-align:center; color:var(--muted); font-size:.83rem; }

    .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
      background:rgba(15,15,35,.96); border:1px solid var(--border); border-radius:12px;
      padding:12px 20px; font-size:.85rem; opacity:0; pointer-events:none;
      transition:opacity .3s, transform .3s; z-index:200; max-width:90vw; }
    .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
    .toast.error { border-color:rgba(239,68,68,.5); color:#fca5a5; }
    .toast.success { border-color:rgba(16,185,129,.5); color:#6ee7b7; }
  </style>
</head>
<body>
  <div class="grid-bg"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <!-- ══════════════ LOGIN ══════════════ -->
  <div class="page" id="login-view">
    <div class="login-box">
      <div class="login-icon">⚔️</div>
      <h2>Main Arena</h2>
      <p class="login-sub">Log in with your team credentials to start coding</p>
      <div class="inp-wrap">
        <label>Team Name</label>
        <input type="text" id="team-name" placeholder="Team Alpha" autocomplete="off" />
      </div>
      <div class="inp-wrap">
        <label>Passcode</label>
        <input type="password" id="passcode" placeholder="••••••••" />
      </div>
      <button class="btn-login" id="btn-login">Enter Arena</button>
      <div class="err-msg" id="login-err"></div>
      <div class="back-link"><a href="index.html">← Back to arena selection</a></div>
    </div>
  </div>

  <!-- ══════════════ ARENA ══════════════ -->
  <div class="page" id="arena-view">
    <div class="topbar">
      <div class="topbar-inner">
        <div class="team-pill">
          <div class="avatar" id="avatar">T</div>
          <span class="tname" id="tname">Team</span>
        </div>

        <div class="timer-block">
          <div id="timer" class="timer-green">--:--:--</div>
          <div class="timer-label">Time Remaining</div>
        </div>

        <div style="display:flex; align-items:center; gap:8px;">
          <span class="stat-pill">Points <b id="points">0</b></span>
          <span class="stat-pill">Best <b id="best">0</b></span>
          <button class="btn-logout" id="btn-logout">Log out</button>
        </div>
      </div>
    </div>

    <div class="arena-grid">
      <!-- LEFT: questions + problem -->
      <div class="editor-col">
        <div class="panel">
          <div class="panel-head"><span class="panel-title">Questions</span></div>
          <div class="q-tabs" id="q-tabs"></div>
        </div>

        <div class="panel">
          <div class="panel-head">
            <span class="panel-title">Problem</span>
            <span class="stat-pill"><b id="q-points">0</b> pts</span>
          </div>
          <div class="problem-body">
            <div class="problem-title" id="q-title">—</div>
            <div class="problem-desc" id="q-desc"></div>
            <div class="section-label">Sample Tests</div>
            <div id="q-samples"></div>
          </div>
        </div>
      </div>

      <!-- RIGHT: editor + results -->
      <div class="editor-col">
        <div class="panel">
          <div class="editor-bar">
            <select id="lang-select"></select>
            <span class="spacer"></span>
            <span class="hint">Ctrl+Enter to submit</span>
            <button class="btn btn-run" id="btn-run">▶ Run Samples</button>
            <button class="btn btn-submit" id="btn-submit">⚡ Submit</button>
          </div>
          <div id="monaco-host"></div>
          <textarea id="code-fallback" spellcheck="false" style="display:none"></textarea>
          <div class="editor-loading" id="editor-status">Loading editor…</div>
        </div>

        <div class="panel">
          <div class="panel-head"><span class="panel-title">Results</span>
            <span class="hint" id="last-run"></span></div>
          <div id="verdict" style="display:none" class="verdict">
            <span class="verdict-dot" id="v-dot"></span>
            <span class="verdict-text" id="v-text"></span>
            <span class="verdict-stats" id="v-stats"></span>
          </div>
          <div class="results-list" id="results">
            <div class="empty">Run the samples or submit your solution to see results.</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js"></script>
  <script>
  /* ════════════════════════════════════════════════════════════════════
     Configuration
     ════════════════════════════════════════════════════════════════════ */
  const API = 'http://localhost:8000';
  const SESSION_KEY = 'mpl_team';
  const DRAFT_KEY = 'mpl_drafts';          // code survives tab + language switches
  const LANG_LABELS = { python:'Python 3', c:'C (GCC)', cpp:'C++ (G++)', java:'Java' };
  const MONACO_LANG = { python:'python', c:'c', cpp:'cpp', java:'java' };

  /* ════════════════════════════════════════════════════════════════════
     State
     ════════════════════════════════════════════════════════════════════ */
  let session = null;          // { id, name, token }
  let questions = [];
  let currentQ = null;
  let language = 'python';
  let editor = null;           // monaco instance, or null when using the textarea
  let monacoReady = false;
  let clockRemaining = null;
  let busy = false;

  const $ = (id) => document.getElementById(id);

  /* ════════════════════════════════════════════════════════════════════
     Helpers
     ════════════════════════════════════════════════════════════════════ */
  function showToast(msg, kind = '') {
    const t = $('toast');
    t.textContent = msg;
    t.className = 'toast show ' + kind;
    clearTimeout(t._timer);
    t._timer = setTimeout(() => { t.className = 'toast ' + kind; }, 4200);
  }

  function escapeHtml(s) {
    return String(s ?? '').replace(/[&<>"']/g, c =>
      ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  }

  async function api(path, options = {}) {
    const headers = Object.assign({ 'Content-Type': 'application/json' }, options.headers || {});
    if (session && session.token) headers['X-Team-Token'] = session.token;
    const res = await fetch(API + path, Object.assign({}, options, { headers }));
    let data = null;
    try { data = await res.json(); } catch (e) { data = null; }
    if (res.status === 401) { doLogout(true); throw new Error('Session expired'); }
    return { status: res.status, ok: res.ok, data };
  }

  function fmtTime(sec) {
    if (sec == null) return '--:--:--';
    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600) / 60);
    const s = Math.floor(sec % 60);
    return [h, m, s].map(v => String(v).padStart(2, '0')).join(':');
  }

  /* ── drafts: keep code per question + language ── */
  function draftKey(qid, lang) { return `${session.id}:${qid}:${lang}`; }
  function loadDrafts() {
    try { return JSON.parse(localStorage.getItem(DRAFT_KEY) || '{}'); } catch (e) { return {}; }
  }
  function saveDraft() {
    const d = loadDrafts();
    d[draftKey(currentQ.id, language)] = getCode();
    localStorage.setItem(DRAFT_KEY, JSON.stringify(d));
  }
  function readDraft(qid, lang) {
    const d = loadDrafts();
    const key = `${session.id}:${qid}:${lang}`;
    if (key in d) return d[key];
    const q = questions.find(x => x.id === qid);
    let starter = {};
    try { starter = JSON.parse(q?.starter_code || '{}'); } catch (e) { starter = {}; }
    return starter[lang] || starter.python || '';
  }

  /* ════════════════════════════════════════════════════════════════════
     Editor (Monaco, with a plain-textarea fallback for offline venues)
     ════════════════════════════════════════════════════════════════════ */
  function initMonaco() {
    if (typeof require === 'undefined') { useFallback('Editor CDN unavailable — using plain text editor'); return; }

    // If the CDN answers but the editor module never arrives (slow / blocked
    // network at a venue), don't leave the team staring at "Loading editor…".
    setTimeout(() => {
      if (!monacoReady && !editor) {
        useFallback('Editor CDN timed out — using plain text editor');
      }
    }, 8000);

    try {
      require.config({ paths: { vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs' } });
      require(['vs/editor/editor.main'], function () {
        if (monacoReady || editor) return;      // fallback already took over
        const typed = $('code-fallback').value;  // keep anything typed meanwhile
        editor = monaco.editor.create($('monaco-host'), {
          value: '',
          language: 'python',
          theme: 'vs-dark',
          fontSize: 14,
          fontFamily: "'JetBrains Mono', monospace",
          minimap: { enabled: false },
          scrollBeyondLastLine: false,
          automaticLayout: true,
          tabSize: 4,
          renderWhitespace: 'selection',
        });
        monacoReady = true;
        $('monaco-host').style.display = 'block';
        $('code-fallback').style.display = 'none';
        $('editor-status').style.display = 'none';
        editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.Enter, () => submitCode());
        if (currentQ) setEditorValue(typed || readDraft(currentQ.id, language), language);
      });
    } catch (e) {
      useFallback('Monaco failed to load — using plain text editor');
    }
  }

  function useFallback(msg) {
    if ($('code-fallback').style.display === 'block') return;   // already fell back
    monacoReady = false;
    $('monaco-host').style.display = 'none';
    $('code-fallback').style.display = 'block';
    $('editor-status').style.display = 'block';
    $('editor-status').textContent = msg + ' (your code still runs normally)';
    if (currentQ && !$('code-fallback').value) {
      $('code-fallback').value = readDraft(currentQ.id, language);
    }
  }

  function getCode() {
    return monacoReady && editor ? editor.getValue() : $('code-fallback').value;
  }
  function setEditorValue(value, lang) {
    if (monacoReady && editor) {
      editor.setValue(value || '');
      monaco.editor.setModelLanguage(editor.getModel(), MONACO_LANG[lang] || 'plaintext');
    } else {
      $('code-fallback').value = value || '';
    }
  }

  /* ════════════════════════════════════════════════════════════════════
     Login / logout
     ════════════════════════════════════════════════════════════════════ */
  async function doLogin() {
    const name = $('team-name').value.trim();
    const passcode = $('passcode').value.trim();
    const err = $('login-err');
    err.classList.remove('show');
    if (!name || !passcode) { err.textContent = 'Enter both team name and passcode.'; err.classList.add('show'); return; }

    $('btn-login').disabled = true;
    $('btn-login').textContent = 'Entering…';
    try {
      const res = await fetch(API + '/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, passcode }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        err.textContent = data.detail || 'Login failed.';
        err.classList.add('show');
        return;
      }
      session = { id: data.id, name: data.name, token: data.session_token };
      sessionStorage.setItem(SESSION_KEY, JSON.stringify(session));
      await enterArena();
    } catch (e) {
      err.textContent = 'Cannot reach the server. Is the API running on port 8000?';
      err.classList.add('show');
    } finally {
      $('btn-login').disabled = false;
      $('btn-login').textContent = 'Enter Arena';
    }
  }

  function doLogout(silent) {
    sessionStorage.removeItem(SESSION_KEY);
    session = null;
    $('arena-view').style.display = 'none';
    $('login-view').style.display = 'flex';
    if (!silent) showToast('Logged out.');
  }

  /* ════════════════════════════════════════════════════════════════════
     Arena
     ════════════════════════════════════════════════════════════════════ */
  async function enterArena() {
    $('login-view').style.display = 'none';
    $('arena-view').style.display = 'block';
    $('tname').textContent = session.name;
    $('avatar').textContent = (session.name || 'T').charAt(0).toUpperCase();

    if (!monacoReady && !editor) initMonaco();
    startClock();
    await loadQuestions();
  }

  async function loadQuestions() {
    const res = await api('/api/main/questions');
    if (!res.ok) { showToast('Could not load questions.', 'error'); return; }
    questions = res.data;

    if (!questions.length) {
      $('q-tabs').innerHTML = '<div class="empty">No MAIN questions have been set up yet.</div>';
      return;
    }
    renderTabs();
    selectQuestion(questions[0].id);
  }

  function renderTabs() {
    $('q-tabs').innerHTML = questions.map((q, i) => {
      const cls = q.sub_type === 'DEBUGGING' ? 'badge-debug'
                : q.sub_type === 'MATH' ? 'badge-math' : 'badge-leetcode';
      const label = (q.sub_type || 'MAIN').replace('_', ' ');
      const solved = q.status === 'SOLVED';
      return `<button class="q-tab ${q.id === (currentQ && currentQ.id) ? 'active' : ''}" data-id="${q.id}">
        <div class="q-tab-top">
          <span class="q-tab-name">${i + 1}. ${escapeHtml(q.title)}</span>
          <span class="badge ${cls}">${label}</span>
        </div>
        <div class="q-tab-meta">
          <span>${q.points} pts</span>
          <span>${q.attempts} attempt${q.attempts === 1 ? '' : 's'}</span>
          <span class="${solved ? 'ok' : ''}">${solved ? '✓ solved' : 'best ' + q.best_score}</span>
        </div>
      </button>`;
    }).join('');

    $('q-tabs').querySelectorAll('.q-tab').forEach(btn => {
      btn.onclick = () => selectQuestion(parseInt(btn.dataset.id, 10));
    });
  }

  function selectQuestion(id) {
    if (currentQ) saveDraft();                 // keep work before switching
    currentQ = questions.find(q => q.id === id) || questions[0];

    // languages allowed for this question
    let allowed = ['python', 'c', 'cpp', 'java'];
    try {
      const parsed = JSON.parse(currentQ.allowed_languages || 'null');
      if (Array.isArray(parsed) && parsed.length) allowed = parsed;
    } catch (e) { /* keep default */ }
    if (!allowed.includes(language)) language = allowed[0];

    $('lang-select').innerHTML = allowed
      .map(l => `<option value="${l}">${LANG_LABELS[l] || l}</option>`).join('');
    $('lang-select').value = language;

    $('q-title').textContent = currentQ.title;
    $('q-desc').textContent = currentQ.description;
    $('q-points').textContent = currentQ.points;
    $('best').textContent = currentQ.best_score;

    const samples = currentQ.visible_tests || [];
    $('q-samples').innerHTML = samples.length
      ? samples.map((t, i) => `
          <div class="sample">
            <div class="sample-row"><span class="k">Input ${i + 1}</span><span class="v">${escapeHtml(t.stdin)}</span></div>
            <div class="sample-row"><span class="k">Output</span><span class="v">${escapeHtml(t.expected_output)}</span></div>
          </div>`).join('')
      : '<div class="hint">No sample tests for this question.</div>';

    setEditorValue(readDraft(currentQ.id, language), language);
    renderTabs();
    clearResults();
  }

  /* ── run / submit ── */
  async function runOrSubmit(scored) {
    if (busy || !currentQ) return;
    const source = getCode();
    if (!source.trim()) { showToast('Write some code first.', 'error'); return; }

    saveDraft();
    busy = true;
    $('btn-run').disabled = true;
    $('btn-submit').disabled = true;
    $('btn-submit').textContent = scored ? 'Judging…' : 'Running…';
    $('last-run').textContent = scored ? 'Submitting…' : 'Running samples…';

    try {
      const res = await api(scored ? '/api/main/submit' : '/api/main/run', {
        method: 'POST',
        body: JSON.stringify({ question_id: currentQ.id, language, source_code: source }),
      });

      if (res.status === 429) { showToast(res.data.detail, 'error'); return; }
      if (res.status === 403) { showToast(res.data.detail, 'error'); return; }
      if (!res.ok) {
        showToast((res.data && res.data.detail) || 'Something went wrong.', 'error');
        return;
      }
      renderResults(res.data, scored);

      if (scored) {
        const d = res.data;
        $('best').textContent = d.best_score;
        $('points').textContent = d.team_points;
        currentQ.best_score = d.best_score;
        currentQ.attempts += 1;
        if (d.verdict === 'PASSED') currentQ.status = 'SOLVED';
        renderTabs();
        if (d.score_delta > 0) showToast(`+${d.score_delta} points — best is now ${d.best_score}/${currentQ.points}`, 'success');
        else if (d.verdict === 'PASSED') showToast('All tests passed.', 'success');
        else if (d.verdict === 'PARTIAL') showToast(`${d.tests_passed}/${d.tests_total} tests passed. No change to your best score.`);
        else if (d.verdict === 'ERROR') showToast(d.error_message || 'Judge error — no score changed.', 'error');
      } else {
        showToast(res.data.tests_passed + '/' + res.data.tests_total + ' sample tests passed.');
      }
    } catch (e) {
      if (e.message !== 'Session expired') showToast('Network error: ' + e.message, 'error');
    } finally {
      busy = false;
      $('btn-run').disabled = false;
      $('btn-submit').disabled = false;
      $('btn-submit').textContent = '⚡ Submit';
      $('last-run').textContent = '';
    }
  }

  function runSamples() { runOrSubmit(false); }
  function submitCode() { runOrSubmit(true); }

  function clearResults() {
    $('verdict').style.display = 'none';
    $('results').innerHTML = '<div class="empty">Run the samples or submit your solution to see results.</div>';
  }

  function renderResults(d, scored) {
    const map = {
      PASSED:  ['v-passed',  '#10b981', 'All tests passed'],
      PARTIAL: ['v-partial', '#f59e0b', 'Partial — some tests passed'],
      FAILED:  ['v-failed',  '#ef4444', 'Tests failed'],
      ERROR:   ['v-error',   '#f59e0b', 'Judge error — no score changed'],
      QUEUED:  ['v-error',   '#64748b', 'Queued'],
      JUDGING: ['v-error',   '#64748b', 'Judging…'],
    };
    const [cls, colour, text] = map[d.verdict] || ['v-failed', '#64748b', d.verdict];

    $('verdict').style.display = 'flex';
    $('v-dot').style.background = colour;
    $('v-text').className = 'verdict-text ' + cls;
    $('v-text').textContent = text;

    const stats = [`${d.tests_passed}/${d.tests_total} tests`];
    if (scored) stats.push(`scored ${d.score} pts`, `best ${d.best_score}`);
    if (d.error_message) stats.push(d.error_message);
    $('v-stats').textContent = stats.join('  ·  ');

    const rows = (d.results || []).map((r, i) => {
      const label = r.is_hidden ? `Hidden test ${i + 1}` : `Sample test ${i + 1}`;
      const status = r.judge_status || (r.passed ? 'Accepted' : 'Failed');
      let body = '';

      if (r.compile_output) {
        body += `<pre class="out">${escapeHtml(r.compile_output)}</pre>`;
      } else if (r.is_hidden) {
        body += `<div class="res-hidden-note">Input and expected output are hidden. ${
          r.passed ? 'Your solution produced the correct output.' : 'Your output did not match.'
        }</div>`;
        if (r.stderr) body += `<pre class="out">${escapeHtml(r.stderr)}</pre>`;
      } else {
        body += `<div class="res-io">
          <div><span class="k">input:    </span>${escapeHtml(r.stdin)}</div>
          <div><span class="k">expected: </span>${escapeHtml(r.expected_output)}</div>
          <div><span class="k">your out: </span>${escapeHtml(r.stdout || '(no output)')}</div>
        </div>`;
        if (r.stderr) body += `<pre class="out">${escapeHtml(r.stderr)}</pre>`;
      }

      return `<div class="res-row ${r.passed ? 'pass' : 'fail'}">
        <div class="res-head">
          <span class="res-name">${r.passed ? '✅' : '❌'} ${label}</span>
          <span class="res-status">${escapeHtml(status)}</span>
        </div>
        ${body}
      </div>`;
    });

    $('results').innerHTML = rows.length ? rows.join('') :
      '<div class="empty">No test results returned.</div>';
  }

  /* ── clock ── */
  function paintClock() {
    const el = $('timer');
    if (clockRemaining == null) { el.textContent = '--:--:--'; return; }
    el.textContent = fmtTime(clockRemaining);
    el.className = clockRemaining <= 0 ? 'timer-red'
      : clockRemaining < 300 ? 'timer-red'
      : clockRemaining < 900 ? 'timer-yellow' : 'timer-green';
  }

  async function syncClock() {
    try {
      const res = await api('/api/main/clock');
      if (res.ok && res.data.started) clockRemaining = res.data.seconds_remaining;
    } catch (e) { /* keep ticking locally */ }
  }

  function startClock() {
    syncClock();
    clearInterval(window._clockSync);
    clearInterval(window._clockTick);
    window._clockSync = setInterval(syncClock, 15000);
    window._clockTick = setInterval(() => {
      if (clockRemaining == null) return;
      if (clockRemaining > 0) clockRemaining -= 1;
      paintClock();
    }, 1000);
  }

  /* ════════════════════════════════════════════════════════════════════
     Boot
     ════════════════════════════════════════════════════════════════════ */
  $('btn-login').onclick = doLogin;
  $('passcode').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  $('team-name').addEventListener('keydown', e => { if (e.key === 'Enter') $('passcode').focus(); });
  $('btn-logout').onclick = () => doLogout(false);
  $('btn-run').onclick = runSamples;
  $('btn-submit').onclick = submitCode;
  $('lang-select').onchange = (e) => {
    if (!currentQ) return;
    saveDraft();
    language = e.target.value;
    setEditorValue(readDraft(currentQ.id, language), language);
  };

  (function boot() {
    const saved = sessionStorage.getItem(SESSION_KEY);
    if (saved) {
      try {
        const parsed = JSON.parse(saved);
        if (parsed && parsed.token) { session = parsed; enterArena(); return; }
      } catch (e) { sessionStorage.removeItem(SESSION_KEY); }
    }
    $('login-view').style.display = 'flex';
  })();
  </script>
</body>
</html>
